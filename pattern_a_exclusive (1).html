
<style>
  .tbl-wrap { background: #ffffff; padding: 1rem; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; background: #ffffff; }
  th, td { padding: 9px 6px; border: 0.5px solid #d0d0d0; text-align: center; }
  th { background: #f5f5f5; font-weight: 500; font-size: 12px; color: #555; vertical-align: bottom; }
  th.pair-a { border-bottom: 2px solid #5DCAA5; }
  th.pair-b { border-bottom: 2px solid #aaa; }
  th.label  { text-align: left; font-size: 13px; color: #111; padding-left: 10px; font-weight: 400; }

  .pill {
    display: inline-block; min-width: 44px; min-height: 28px;
    padding: 5px 10px; border-radius: 20px;
    font-size: 13px; font-family: inherit;
    font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .pill.is-on  { background: #E1F5EE; color: #085041; border: 1.5px solid #5DCAA5; font-weight: 700; }
  .pill.is-off { background: #f0f0f0; color: #666;    border: 1.5px solid #ccc;    font-weight: 400; }
  .pill:disabled { background: #f7f7f7; color: #bbb; border: 1.5px solid #e0e0e0; font-weight: 400; cursor: not-allowed; }
  .pill:not(:disabled):hover { opacity: 0.75; }
  .pill:focus-visible { outline: 2px solid #1D9E75; outline-offset: 3px; }

  .hdr-btn {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 5px; width: 22px; height: 22px;
    border: 0.5px solid #aaa; border-radius: 50%;
    background: transparent; color: #444;
    cursor: pointer; font-family: inherit; font-size: 13px; line-height: 1;
  }
  .hdr-btn:hover { background: #eee; }
  .hdr-btn:disabled { color: #ccc; border-color: #ddd; cursor: not-allowed; }
  .hdr-btn:disabled:hover { background: transparent; }
  .hdr-btn:focus-visible { outline: 2px solid #1D9E75; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>

<div class="tbl-wrap">
  <table>
    <caption class="sr-only">Settings table. One value per row. Columns A and B are mutually exclusive, as are C and D.</caption>
    <thead>
      <tr>
        <th style="text-align:left;" scope="col">Setting</th>
        <th scope="col" class="pair-a" id="th-0"></th>
        <th scope="col" class="pair-a" id="th-1"></th>
        <th scope="col" class="pair-b" id="th-2"></th>
        <th scope="col" class="pair-b" id="th-3"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const rows = ['Notifications','Auto-save','Dark mode','Analytics'];
const nums = [
  [12,  3,  7, 21],
  [ 5, 44,  2,  9],
  [18,  1, 33,  6],
  [ 7, 12,  4, 17],
];
const colNames = ['A','B','C','D'];
const pairs = [[0,1],[0,1],[2,3],[2,3]];

const state = [
  [true,  false, true,  false],
  [false, true,  false, true ],
  [true,  false, false, false],
  [false, false, true,  false],
];

function anyOn(col) { return rows.some((_, r) => state[r][col]); }
function pairBlocked(col) {
  const partner = pairs[col].find(p => p !== col);
  return anyOn(partner);
}

function canToggleOn(r, c) {
  if (pairBlocked(c)) return false;
  const otherPairOn = pairs[c].filter(p => p !== c).some(p => state[r][p]);
  if (otherPairOn) return false;
  const alreadyOnInRow = colNames.some((_, ci) => state[r][ci] && ci !== c);
  if (alreadyOnInRow) return false;
  return true;
}

function renderHeaders() {
  colNames.forEach((col, c) => {
    const th = document.getElementById(`th-${c}`);
    const on = anyOn(c);
    const blocked = pairBlocked(c);
    if (blocked) {
      th.innerHTML = `Col ${col}<br>
        <button class="hdr-btn" disabled
          aria-label="Col ${col} unavailable — paired column has active items">—</button>`;
    } else if (on) {
      th.innerHTML = `Col ${col}<br>
        <button class="hdr-btn" onclick="setAll(${c},false)"
          aria-label="Disable all in Col ${col}" title="Disable all">✕</button>`;
    } else {
      th.innerHTML = `Col ${col}<br>
        <button class="hdr-btn" onclick="setAll(${c},true)"
          aria-label="Enable all in Col ${col}" title="Enable all">✓</button>`;
    }
  });
}

function renderBody() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  rows.forEach((row, r) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<th scope="row" class="label">${row}</th>` +
      colNames.map((col, c) => {
        const on = state[r][c];
        const blocked = !on && !canToggleOn(r, c);
        const cls = on ? 'is-on' : 'is-off';
        const label = on
          ? `${row}, Col ${col}: on. Click to turn off.`
          : blocked
            ? `${row}, Col ${col}: unavailable.`
            : `${row}, Col ${col}: off. Click to turn on.`;
        return `<td>
          <button class="pill ${cls}"
            role="switch" aria-pressed="${on}"
            aria-label="${label}"
            ${blocked ? 'disabled' : `onclick="toggle(${r},${c})"`}
          >${nums[r][c]}</button>
        </td>`;
      }).join('');
    tbody.appendChild(tr);
  });
}

function render() { renderHeaders(); renderBody(); }

function toggle(r, c) {
  if (!state[r][c] && !canToggleOn(r, c)) return;
  if (!state[r][c]) {
    colNames.forEach((_, ci) => { state[r][ci] = false; });
  }
  state[r][c] = !state[r][c];
  render();
  document.querySelectorAll('#tbody tr')[r].querySelectorAll('.pill')[c].focus();
}

function setAll(col, val) {
  if (val && pairBlocked(col)) return;
  rows.forEach((_, r) => {
    if (val) {
      if (!canToggleOn(r, col)) return;
      colNames.forEach((_, ci) => { state[r][ci] = false; });
      state[r][col] = true;
    } else {
      state[r][col] = false;
    }
  });
  render();
  document.getElementById(`th-${col}`).querySelector('.hdr-btn').focus();
}

render();
</script>
